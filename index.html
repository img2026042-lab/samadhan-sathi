<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101f43">
<title>Samadhan Sathi — Civic Grievance Intelligence</title>
<style>
:root{color-scheme:light;--navy:#101f43;--teal:#1aa99a;--muted:#687791}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#17233d;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:560px;width:100%;background:#fff;border:1px solid #e3e8f1;border-radius:20px;padding:32px;box-shadow:0 12px 36px #10254b12}
.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--navy);color:#fff;font-weight:850;font-size:22px;margin-bottom:22px}
h1{font-size:26px;letter-spacing:-.5px;margin:0 0 8px}
p{color:var(--muted);font-size:14px;margin:0 0 18px}
.track{height:6px;background:#e7edf5;border-radius:10px;overflow:hidden;margin:22px 0}
.track span{display:block;height:100%;width:36%;background:var(--teal);border-radius:10px;animation:load 1.1s ease-in-out infinite alternate}
small{color:var(--muted);font-size:12px}
a{color:#087e75}
@keyframes load{to{width:94%}}
</style>
</head>
<body>
<main>
  <div class="mark">S</div>
  <h1>Samadhan Sathi</h1>
  <p>AI-assisted civic grievance prototype for Gwalior, Madhya Pradesh.</p>
  <div class="track" aria-hidden="true"><span></span></div>
  <p id="status" role="status">Loading the interactive prototype…</p>
  <small>If loading does not complete, run <code>python tools/build.py --output dist/index.html</code> and serve the <code>dist</code> folder over HTTP.</small>
</main>
<script>
(async()=>{
  const parts=["source/app.bundle.01.txt","source/app.bundle.02.txt","source/app.bundle.03.txt","source/app.bundle.04.txt","source/app.bundle.05.txt"];
  try{
    const encoded=(await Promise.all(parts.map(async path=>{
      const response=await fetch(new URL(path,document.baseURI));
      if(!response.ok)throw new Error("Could not load "+path);
      return response.text();
    }))).join("").trim();
    const bytes=Uint8Array.from(atob(encoded),ch=>ch.charCodeAt(0));
    if(!("DecompressionStream" in window))throw new Error("This browser does not support gzip decompression. Use the Python build command in the README.");
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }catch(error){
    const status=document.getElementById("status");
    status.textContent="The app bundle could not load. "+error.message;
  }
})();
</script>
</body>
</html>
